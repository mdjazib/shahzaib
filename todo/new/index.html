<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kanban</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header>
        <h2>kanban</h2>
        <div class="create" onclick="createTask()">
            <div class="line"></div>
            <div class="line"></div>
        </div>
    </header>
    <main>
        <div class="col todo">
            <div class="head">
                <h2>Todo</h2>
            </div>
        </div>
        <div class="col pending">
            <div class="head">
                <h2>Pending</h2>
            </div>
        </div>
        <div class="col completed">
            <div class="head">
                <h2>Completed</h2>
            </div>
        </div>
        <div class="col postponed">
            <div class="head">
                <h2>Postponed</h2>
            </div>
        </div>
    </main>
    <script src="script.js"></script>
</body>

</html>
